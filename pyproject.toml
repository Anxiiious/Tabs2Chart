[project]
name = "shred2chart"
version = "0.1.0"
description = "Convert Sheet Happens Guitar Pro tabs into Clone Hero charts"
requires-python = ">=3.10"
dependencies = [
    "PyGuitarPro>=0.11",
]

[project.scripts]
shred2chart = "shred2chart.cli:main"
shred2chart-gui = "shred2chart.gui:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "argcomplete>=3.0",
    "PySide6-Essentials>=6.6",
]
gui = [
    # Essentials, not the full PySide6 metapackage: Addons roughly doubles the
    # install and the importer only uses QtWidgets/QtGui/QtCore/QtSvg.
    "PySide6-Essentials>=6.6",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shred2chart"]
